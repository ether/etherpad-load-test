name: "Backend tests"

# any branch is useful for testing before a PR is submitted
on: [push, pull_request]

permissions:
  contents: read

jobs:
  loadtest:
    if: |
      (github.event_name != 'pull_request')
      || (github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id)
    name: load test
    runs-on: ubuntu-latest

    steps:
      - name: Check out etherpad-load-test
        uses: actions/checkout@v4
        with:
          path: ./loadtest

      - name: Check out Etherpad core
        uses: actions/checkout@v4
        with:
          repository: ether/etherpad-lite
          path: ./etherpad

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.33.2
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Build and link etherpad-load-test
        run: |
          cd ./loadtest
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm link --global

      - name: Run unit tests
        run: |
          cd ./loadtest
          pnpm test

      - name: Install Etherpad core dependencies
        run: |
          cd ./etherpad
          pnpm install --frozen-lockfile

      - name: Run the load test
        run: |
          cd ./etherpad
          src/tests/frontend/travis/runnerLoadTest.sh 25 50

      - name: Run sweep integration test
        env:
          LOADTEST_INTEGRATION_URL: http://127.0.0.1:9001
        run: |
          # The previous step (runnerLoadTest.sh) tore Etherpad down, so
          # bring a minimal one back up just for the sweep integration test.
          cd ./etherpad
          (cd src && pnpm run prod &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9001/ >/dev/null && break
            sleep 1
          done
          cd ../loadtest
          pnpm test:integration
